<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24412f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Еда">
<meta name="robots" content="noindex">
<title>Еда · Лиза и Олег</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ee; --surface:#fff; --ink:#1f2a22; --muted:#6b7068; --line:#e1dfd6; --cell:#fbfaf6;
  --accent:#2f6b45; --accent-soft:#e3efe6; --warn:#b4600f; --warn-soft:#fbeedd; --bad:#b3322b;
  --k:#c0571b; --b:#2f6b45; --j:#b08a12; --u:#3b5f9e;
  --display:"Literata", Georgia, serif; --body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121512; --surface:#1b201c; --ink:#e6ebe4; --muted:#9aa396; --line:#2d342e; --cell:#171b18;
  --accent:#7fc597; --accent-soft:#213328; --warn:#e8a65a; --warn-soft:#3a2b1a; --bad:#ff7b72;
  --k:#f0905a; --b:#7fc597; --j:#e0c35a; --u:#8fb0ee; color-scheme: dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font:700 24px var(--display);margin:0}
h2{font:700 19px var(--display);margin:0}
h3{font:600 15px var(--body);margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.who{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.who button{border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--accent);color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;max-width:820px;width:100%;gap:2px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 12.5px var(--body);padding:6px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button.btn,a.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input[type=number]{width:90px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 14px var(--body);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kbju{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;font-variant-numeric:tabular-nums}
.kbju span b{font-weight:700}
.k{color:var(--k)} .b{color:var(--b)} .j{color:var(--j)} .u{color:var(--u)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--bad)}
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.goal .t{font-size:12px;color:var(--muted)}
.goal .v{font-weight:700;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:500}
.li .s{font-size:13px;color:var(--muted)}
.tag{font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);padding:10px 0;font-size:14px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}
/* Таблица рецепта — как в Google-таблице */
.sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table.sheet{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:720px;width:100%}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap;background:var(--surface)}
table.sheet thead th{background:var(--cell);font-weight:600;color:var(--muted);text-align:center}
table.sheet td.name{text-align:left;min-width:190px;white-space:normal}
table.sheet td.calc{background:var(--cell)}
table.sheet td.err{color:var(--bad);text-align:left}
table.sheet tr.sum td{font-weight:700;background:var(--accent-soft)}
table.sheet tr.per td{background:var(--cell)}
table.sheet input{border:0;background:transparent;padding:2px 0;width:100%;font-size:13.5px;text-align:inherit;border-radius:0}
table.sheet input:focus{background:var(--accent-soft)}
table.sheet td.g input{text-align:right;width:62px}
table.sheet .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px}
.sticky-first td:first-child,.sticky-first th:first-child{position:sticky;left:0;z-index:1}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog .db{padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-height:72vh;overflow:auto}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 input{width:100%}
.res{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.res button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;padding:8px;cursor:pointer}
.res button:hover,.res button:focus{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.shop-cat{display:flex;flex-direction:column;gap:2px}
.shop-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.shop-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.shop-item.done .t{text-decoration:line-through;color:var(--muted)}
.plan-meal{display:flex;flex-direction:column;gap:8px}
.plan-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--cell)}
.plan-row input.days{width:110px}
.plan-row input.mult{width:64px}
details summary{cursor:pointer}
@media (max-width:520px){.goals{grid-template-columns:repeat(2,1fr)} h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Еда</h1>
    <div class="row">
      <span class="status small muted" id="status"></span>
      <div class="who" id="who"></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<datalist id="productNames"></datalist>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
